<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coniugazioni</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="app-container" class="w-full max-w-md">
        <!-- Schermata di Benvenuto -->
        <div id="welcome-screen" class="bg-white p-6 sm:p-8 md:p-10 rounded-xl shadow-2xl border border-gray-200 text-center">
            <h1 class="text-3xl sm:text-4xl font-bold text-gray-800 mb-4">Coniuga il verbo!</h1>
            <p class="text-gray-600 mb-8">Scegli la modalità di gioco:</p>
            <div class="flex flex-col space-y-4">
                <!-- Il pulsante naviga alla pagina solitario -->
                <a href="solo.html" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold p-3 sm:p-4 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 shadow-md">
                    Solo mode
                </a>
                <!-- Il pulsante naviga alla pagina hard-mode -->
                <a href="hard.html" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold p-3 sm:p-4 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 shadow-md">
                    Hard mode
                </a>
                <!-- Il pulsante naviga alla pagina 1vs1 -->
                <a href="sfida.html" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold p-3 sm:p-4 rounded-lg transition duration-300 ease-in-out transform hover:scale-105 shadow-md">
                    1vs1
                </a>
                <!-- Bottone info -->
                <button onclick="document.getElementById('info-modal').classList.remove('hidden')"
                    class="mt-6 mx-auto flex items-center justify-center w-7 h-7 rounded-full border-2 border-gray-400 text-gray-400 hover:border-gray-600 hover:text-gray-600 transition text-sm font-bold">
                    i
                </button>
            </div>
        </div>
    </div>
    <!-- Modale info -->
    <div id="info-modal" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-2xl p-6 max-w-sm w-full mx-4 relative">
            <button onclick="document.getElementById('info-modal').classList.add('hidden')"
                class="absolute top-3 right-4 text-gray-400 hover:text-gray-700 text-xl font-bold">
                &times;
            </button>
            <h2 class="text-lg font-semibold text-gray-800 mb-3">Informazioni</h2>
            <p class="text-gray-600 text-sm">
                Per segnalare bug o richiedere informazioni, scrivi a <a href="mailto:tua@email.com" class="text-blue-600 hover:underline font-medium">tms.sereni@gmail.com</a>.
            </p>
        </div>
    </div>
</body>
</html>
